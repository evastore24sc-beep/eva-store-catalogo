<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Eva Store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      font-family: sans-serif;
    }
    .admin-section {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-submit {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
    }
    .btn-cancel {
      background: #6c757d;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      display: none;
    }
    .btn-logout {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      float: right;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .admin-table th, .admin-table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    .admin-table th {
      background-color: #f4f4f4;
    }
    .admin-table img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
    .btn-edit {
      background: #ffc107;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 5px;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    #login-section {
      max-width: 400px;
      margin: 80px auto;
    }
    #admin-content {
      display: none;
    }
    .btn-filter {
      background-color: #f1f1f1;
      color: #333;
      border: 1px solid #ccc;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .btn-filter.active, .btn-filter:hover {
      background-color: #28a745;
      color: white;
      border-color: #28a745;
    }
  </style>
</head>
<body>

  <!-- SECCIÓN DE LOGIN -->
  <div id="login-section" class="admin-section">
    <h2>Iniciar Sesión - Eva Store Admin</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="login-email">Correo Electrónico:</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña:</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Ingresar</button>
    </form>
  </div>

  <!-- SECCIÓN DE ADMINISTRACIÓN (PROTEGIDA) -->
  <div id="admin-content" class="admin-container">
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    
    <!-- FORMULARIO DE PRODUCTOS -->
    <div class="admin-section">
      <h1 id="form-title">Agregar Nuevo Producto</h1>
      
      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="precio">Precio (sólo números):</label>
          <input type="number" id="precio" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría (rostro, labios, ojos, skincare, etc.):</label>
          <input type="text" id="categoria" required>
        </div>

        <div class="form-group">
          <label for="imagen">Ruta de imagen (ej: img/Base-raquel-detox.jpeg):</label>
          <input type="text" id="imagen" required>
        </div>

        <div class="form-group">
          <label for="badge">Insignia/Badge (opcional: hot, glow):</label>
          <input type="text" id="badge">
        </div>

        <div class="form-group">
          <label for="badgeText">Texto del Badge (opcional: Nuevo, Oferta):</label>
          <input type="text" id="badgeText">
        </div>

        <div class="form-group">
          <label for="tonos">Tonos (separados por comas, ej: Tono 1, Tono 2):</label>
          <input type="text" id="tonos">
        </div>

        <button type="submit" id="btnSave" class="btn-submit">Guardar Producto</button>
        <button type="button" id="btnCancel" class="btn-cancel" onclick="cancelarEdicion()">Cancelar Edición</button>
      </form>
    </div>

    <!-- LISTADO DE PRODUCTOS CON BUSCADOR Y FILTROS -->
    <div class="admin-section">
      <h2>Productos Registrados</h2>
      
      <!-- Buscador y Filtros por Categoría -->
      <div style="margin-bottom: 20px;">
        <div class="form-group" style="margin-bottom: 12px;">
          <input 
            type="text" 
            id="admin-search-input" 
            placeholder="🔍 Buscar por nombre o categoría..." 
            oninput="filtrarProductosAdmin()"
          >
        </div>
        
        <!-- Botones de Categorías -->
        <div id="admin-category-filters" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn-filter active" onclick="filtrarPorCategoriaAdmin('todos', this)">Todos</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('rostro', this)">Rostro</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('labios', this)">Labios</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('ojos', this)">Ojos</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('cejas', this)">Cejas</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('skincare', this)">Skincare</button>
          <button type="button" class="btn-filter" onclick="filtrarPorCategoriaAdmin('corporal', this)">Corporal</button>
        </div>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos">
          <tr>
            <td colspan="5" style="text-align: center;">Cargando productos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
